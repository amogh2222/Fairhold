services:
  - type: web
    name: fairhold-web
    env: node
    plan: free
    region: oregon
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npm start
    healthCheckPath: /api/auth/me
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: fairhold-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: PAYPAL_API_BASE
        value: https://api-m.sandbox.paypal.com
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: LLM_PROVIDER
        value: google
      - key: LLM_API_KEY
        sync: false
      - key: LLM_MODEL_TEXT
        value: gemini-2.0-flash
      - key: LLM_MODEL_VISION
        value: gemini-2.0-flash
      - key: CHANNEL3_API_KEY
        sync: false

databases:
  - name: fairhold-db
    plan: free
    region: oregon
    databaseName: fairhold
    user: fairhold_user
